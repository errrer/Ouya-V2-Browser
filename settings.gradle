pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Crosswalk (Chromium for Android 4.x) publishes its Maven artifacts here.
        maven {
            url 'https://download.01.org/crosswalk/releases/crosswalk/android/maven2'
            content { includeGroup 'org.xwalk' }
        }
    }
}

rootProject.name = 'ouya-browser'
include ':app'
