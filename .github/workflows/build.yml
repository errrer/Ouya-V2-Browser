name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME). Accepting the licences
      # up front lets Gradle download any missing platform or build-tools package by itself.
      # (`|| true`: `yes` is killed by SIGPIPE when sdkmanager finishes, which pipefail reports as failure.)
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Probe engine repositories
        continue-on-error: true
        run: |
          probe() { printf '== %s\n' "$1"; code=$(curl -sS -L -m 40 -o /tmp/p.out -w '%{http_code}' "$1" 2>&1 || true); echo "HTTP $code"; head -c "${2:-250}" /tmp/p.out | tr '\n' ' '; echo; }
          XP=org/xwalk/xwalk_core_library/23.53.589.4/xwalk_core_library-23.53.589.4
          for base in https://maven.aliyun.com/repository/public https://maven.aliyun.com/repository/jcenter https://maven.aliyun.com/repository/google \
                      https://repo.huaweicloud.com/repository/maven https://mirrors.cloud.tencent.com/nexus/repository/maven-public \
                      https://jcenter.bintray.com https://repo.spring.io/libs-release https://jitpack.io; do
            probe "$base/$XP.pom" 120
          done
          probe "https://web.archive.org/web/2022/https://download.01.org/crosswalk/releases/crosswalk/android/maven2/$XP.aar" 120
          probe "https://web.archive.org/web/2022/https://download.01.org/crosswalk/releases/crosswalk/android/maven2/$XP.pom" 300
          probe "https://web.archive.org/web/2022/https://download.01.org/crosswalk/releases/crosswalk/android/maven2/org/xwalk/xwalk_core_library/" 300
          echo "######## GeckoView"
          probe "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-armeabi-v7a/maven-metadata.xml" 100
          curl -sS -m 40 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-armeabi-v7a/maven-metadata.xml | grep -o '<version>6[5-9][^<]*' | head -30
          probe "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml" 100
          curl -sS -m 40 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | grep -o '<version>6[5-9][^<]*' | head -30

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ouya-browser-apk
          path: app/build/outputs/apk/release/*.apk

      # Pushing a tag like v0.1.0 also publishes the APK as a GitHub release you can download on the OUYA.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
