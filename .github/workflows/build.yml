name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME). Accepting the licences
      # up front lets Gradle download any missing platform or build-tools package by itself.
      # (`|| true`: `yes` is killed by SIGPIPE when sdkmanager finishes, which pipefail reports as failure.)
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Probe Crosswalk repository
        continue-on-error: true
        run: |
          B=https://download.01.org/crosswalk/releases/crosswalk/android/maven2/org/xwalk
          for u in "$B/xwalk_core_library/23.53.589.4/xwalk_core_library-23.53.589.4.pom" \
                   "$B/xwalk_core_library/maven-metadata.xml" "$B/xwalk_core_library/" \
                   "https://download.01.org/crosswalk/releases/crosswalk/android/maven2/"; do
            echo "== $u"; curl -sS -L -m 30 -o /tmp/p.out -w 'HTTP %{http_code}\n' "$u" || true; head -c 600 /tmp/p.out; echo
          done

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ouya-browser-apk
          path: app/build/outputs/apk/release/*.apk

      # Pushing a tag like v0.1.0 also publishes the APK as a GitHub release you can download on the OUYA.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
