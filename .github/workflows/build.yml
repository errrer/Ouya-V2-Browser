name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK command-line tools and accepts licences so Gradle can fetch
      # platform 34 and build-tools on its own.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ouya-browser-apk
          path: app/build/outputs/apk/release/*.apk

      # Pushing a tag like v0.1.0 also publishes the APK as a GitHub release you can download on the OUYA.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
